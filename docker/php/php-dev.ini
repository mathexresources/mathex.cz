; Development PHP configuration

; Error reporting
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /var/www/html/log/php.log

; Output buffering (required for Tracy debug bar and session ini changes)
output_buffering = 4096
implicit_flush = Off

; Performance (relaxed for dev)
memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 20M
post_max_size = 22M

; OPcache (disabled in dev for live reloads)
opcache.enable = 0

; Session
session.gc_maxlifetime = 14400

; Date
date.timezone = Europe/Prague
